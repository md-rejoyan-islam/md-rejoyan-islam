<svg width="1200" height="180" viewBox="0 0 1200 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366F1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.12" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.06" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="180" fill="url(#bgGrad)" />

  <!-- Decorative circles -->
  <circle cx="80" cy="40" r="60" fill="white" fill-opacity="0.04" />
  <circle cx="1140" cy="140" r="80" fill="white" fill-opacity="0.04" />
  <circle cx="200" cy="160" r="40" fill="white" fill-opacity="0.03" />
  <circle cx="1050" cy="30" r="50" fill="white" fill-opacity="0.05" />

  <!-- Wave layers at bottom -->
  <path d="M0,130 C200,100 400,155 600,130 C800,105 1000,150 1200,130 L1200,180 L0,180 Z" fill="url(#waveGrad)" />
  <path d="M0,150 C150,130 350,165 550,148 C750,130 950,160 1200,148 L1200,180 L0,180 Z" fill="white" fill-opacity="0.07" />

  <!-- Name text -->
  <text x="600" y="82" font-family="'Segoe UI', Arial, sans-serif" font-size="44" font-weight="700" fill="white" text-anchor="middle" letter-spacing="1">Rejoyan Islam</text>

  <!-- Subtitle -->
  <text x="600" y="120" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="rgba(255,255,255,0.88)" text-anchor="middle" letter-spacing="0.5">Full Stack Developer  ·  React &amp; Node.js  ·  3+ Years</text>

  <!-- Decorative line under name -->
  <line x1="490" y1="92" x2="710" y2="92" stroke="rgba(255,255,255,0.3)" stroke-width="1" />
</svg>
